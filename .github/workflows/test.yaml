name: Run tests

on:
  push:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go tests
        run: |
          go test ./...
      - name: Build WASM
        run: |
          GOOS=js GOARCH=wasm go build -o /dev/null ./cmd/wasm
